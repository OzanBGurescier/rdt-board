/* =====================================================================
   Backup: export JSON / CSV, import JSON
   ===================================================================== */
function download(name, text, type){
  var blob = new Blob([text], { type:type });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}
function stamp(){ return todayStr(); }
function exportJSON(){
  var payload = {
    app: "rdt-task-board", version: 1, exported_at: new Date().toISOString(),
    columns: sortedColumns().map(function(c){ return { id:c.id, name:c.name, position:c.position }; }),
    tasks: state.tasks.map(function(t){ return pickTask(t, true); })
  };
  download("rdt-board-backup-" + stamp() + ".json", JSON.stringify(payload, null, 2), "application/json");
  toast("Backup downloaded (" + payload.tasks.length + " tasks).");
}
function csvCell(v){ v = v == null ? "" : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }
function exportCSV(){
  var head = ["Status","Title","Description","Owners","Due date","Completed on","Labels","Priority","Created","Updated"];
  var colOrder = {}; sortedColumns().forEach(function(c,i){ colOrder[c.id] = i; });
  var open = state.tasks.filter(function(t){ return !isCompleted(t); })
    .sort(function(a,b){ return (colOrder[a.column_id]-colOrder[b.column_id]) || (a.position-b.position); });
  var done = completedTasks().sort(function(a,b){ var ka = completedSortKey(a), kb = completedSortKey(b); return ka < kb ? 1 : ka > kb ? -1 : 0; });
  var rows = open.concat(done).map(function(t){
    var c = colById(t.column_id);
    return [isCompleted(t) ? "Completed" : (c ? c.name : ""), t.title, t.description, t.owner, t.due_date || "", t.completed_on || "",
            (t.labels||[]).join("; "), PRIO_LABEL[t.priority] || t.priority, t.created_at || "", t.updated_at || ""].map(csvCell).join(",");
  });
  download("rdt-board-tasks-" + stamp() + ".csv", "﻿" + head.join(",") + "\r\n" + rows.join("\r\n"), "text/csv");
  toast("CSV downloaded.");
}
function pickTask(t, keepMeta){
  var o = { id:t.id, column_id:t.column_id, title:t.title, description:t.description||"", owner:t.owner||"",
    due_date:t.due_date||null, labels:Array.isArray(t.labels)?t.labels:[], priority:t.priority||"medium", position:+t.position||0 };
  if (t.completed_on) o.completed_on = t.completed_on;
  if (keepMeta) { o.created_by = t.created_by || null; o.created_at = t.created_at || null; o.updated_at = t.updated_at || null; }
  return o;
}
var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function importJSON(file){
  var reader = new FileReader();
  reader.onload = function(){
    var data;
    try { data = JSON.parse(reader.result); } catch(e) { toast("That file isn't valid JSON.", true); return; }
    if (!data || !Array.isArray(data.columns) || !Array.isArray(data.tasks)) { toast("That doesn't look like a board backup.", true); return; }
    // A backup column whose id isn't on this board but whose name is
    // (e.g. restoring into a fresh project) maps onto the existing column.
    var idMap = {};
    var cols = [];
    data.columns.filter(function(c){ return c && UUID_RE.test(c.id) && c.name; }).forEach(function(c){
      var name = String(c.name).slice(0,60);
      if (!colById(c.id)) {
        var same = state.columns.find(function(x){ return x.name.trim().toLowerCase() === name.trim().toLowerCase(); });
        if (same) { idMap[c.id] = same.id; return; }
      }
      cols.push({ id:c.id, name:name, position:+c.position||0 });
    });
    var known = {}; state.columns.concat(cols).forEach(function(c){ known[c.id] = 1; });
    var fallback = (sortedColumns()[0] || cols[0] || {}).id;
    var PRIO_OK = { urgent:1, high:1, medium:1, low:1 };
    var tasks = data.tasks.filter(function(t){ return t && UUID_RE.test(t.id) && t.title; }).map(function(t){
      var o = pickTask(t, false);
      o.title = String(o.title).slice(0,200);
      if (idMap[o.column_id]) o.column_id = idMap[o.column_id];
      if (!known[o.column_id]) o.column_id = fallback;
      if (!PRIO_OK[o.priority]) o.priority = "medium";
      if (o.due_date && !/^\d{4}-\d{2}-\d{2}$/.test(o.due_date)) o.due_date = null;
      if (o.completed_on && !/^\d{4}-\d{2}-\d{2}$/.test(o.completed_on)) delete o.completed_on;
      return o;
    }).filter(function(t){ return t.column_id; });
    var existing = {}; state.tasks.forEach(function(t){ existing[t.id] = 1; });
    var updates = tasks.filter(function(t){ return existing[t.id]; }).length;
    if (!confirm("Import " + cols.length + " columns and " + tasks.length + " tasks?\n\n" +
      (tasks.length - updates) + " new tasks will be added and " + updates + " existing tasks will be overwritten with the backup's version. Nothing is deleted.")) return;
    state.inflight++; setSync();
    API.upsert(cols, tasks).then(function(){ toast("Imported " + tasks.length + " tasks."); })
      .catch(function(e){ toast(errMsg(e), true); })
      .finally(function(){ state.inflight--; reload(); });
  };
  reader.readAsText(file);
}
$("#data-btn").onclick = function(e){
  e.stopPropagation();
  var items = [
    { label:"Download backup (JSON)", run:exportJSON },
    { label:"Download spreadsheet (CSV)", run:exportCSV }
  ];
  if (canEdit()) items.push("-", { label:"Restore from backup…", run:function(){ $("#import-file").click(); } });
  openMenu(this, items);
};
$("#import-file").addEventListener("change", function(){ var f = this.files[0]; this.value = ""; if (f) importJSON(f); });

/* =====================================================================
   Toasts
   ===================================================================== */
function toast(msg, isError){
  var el = document.createElement("div");
  el.className = "toast" + (isError ? " error" : "");
  el.setAttribute("role", isError ? "alert" : "status");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(function(){ el.remove(); }, isError ? 6000 : 3200);
}

/* =====================================================================
   Theme
   ===================================================================== */
var THEME_KEY = "rdt-board-theme";
function effectiveTheme(){
  var set = document.documentElement.getAttribute("data-theme");
  if (set) return set;
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function paintThemeButtons(){
  var cur = effectiveTheme();
  $$("[data-theme-btn]").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-theme-btn") === cur); b.setAttribute("aria-pressed", b.classList.contains("active")); });
}
(function initTheme(){
  var saved = safeStore.get(THEME_KEY);
  if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
  $$("[data-theme-btn]").forEach(function(b){
    b.onclick = function(){
      var v = b.getAttribute("data-theme-btn");
      document.documentElement.setAttribute("data-theme", v);
      safeStore.set(THEME_KEY, v); paintThemeButtons();
    };
  });
  if (window.matchMedia) {
    var mq = matchMedia("(prefers-color-scheme: dark)");
    (mq.addEventListener ? mq.addEventListener.bind(mq, "change") : mq.addListener.bind(mq))(paintThemeButtons);
  }
  paintThemeButtons();
})();

/* =====================================================================
   Toolbar wiring
   ===================================================================== */
var qTimer;
$("#f-q").addEventListener("input", function(){ var v = this.value; clearTimeout(qTimer); qTimer = setTimeout(function(){ state.filters.q = v.trim(); renderFilters(); renderBoard(); }, 120); });
$("#f-owner").addEventListener("change", function(){ state.filters.owner = this.value; saveFilters(); render(); });
$("#f-label").addEventListener("change", function(){ state.filters.label = this.value; saveFilters(); render(); });
$("#f-due").addEventListener("change", function(){ state.filters.due = this.value; saveFilters(); render(); });
$$("[data-view]").forEach(function(b){ b.onclick = function(){ setView(b.getAttribute("data-view")); }; });
$("#f-clear").onclick = function(){ state.filters = { q:"", owner:"", label:"", due:"" }; $("#f-q").value = ""; saveFilters(); render(); };
$("#new-task-btn").onclick = function(){ var c = sortedColumns(); var todo = c.find(function(x){ return /^to ?do$/i.test(x.name); }); openTask(null, (todo || c[0]).id); };
$("#auth-btn").onclick = function(e){ e.stopPropagation(); if (state.user) openAccountMenu(this); else openLogin(); };

/* =====================================================================
   Boot
   ===================================================================== */
async function boot(){
  document.title = CFG.BOARD_TITLE;
  $("#board-title").textContent = CFG.BOARD_TITLE;
  $("#board-subtitle").textContent = CFG.BOARD_SUBTITLE;
  $("#footer-text").textContent = CFG.BOARD_TITLE;
  var pl = $("#portfolio-link");
  if (CFG.PORTFOLIO_URL) pl.href = CFG.PORTFOLIO_URL; else pl.removeAttribute("href");
  loadFilters();
  if (!LIVE) DemoBackend.init();
  render();
  try { await initAuth(); } catch(e) { /* keep going in view mode */ }
  await reload();
  initRealtime();
}
boot();
})();
</script>
